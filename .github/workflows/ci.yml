name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'          # cacheia dependências entre execuções

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      - name: Build sem testes
        run: ./mvnw package -DskipTests

      - name: Testes unitários
        run: ./mvnw test -Dtest="HighAmountRuleTest,SuspiciousLocationRuleTest,FrequencyRuleTest"

      - name: Testes de integração
        run: ./mvnw test -Dtest="TransactionFlowIntegrationTest"
        env:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
